{% extends "layout.html" %}

{% block title %}
    Login
{% endblock title %}

{% block header %}
    <h1>Login</h1>
{% endblock header %}

{% block main %}
    <section class='registrationFormContainer'>
        <form action="{% url "users:login" %}" method='post' class='registrationForm'>
            {% csrf_token %}
            {{ form }}
            {% if request.GET.next %}
                <input type="hidden" name='next' value={{ request.GET.next }}>
            {% endif %}
            <button>Submit</button>
        </form>
    </section>
{% endblock main %}
